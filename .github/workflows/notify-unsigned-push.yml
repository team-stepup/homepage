name: 改ざん検知 (署名なしpushの検出)

# main に push されたコミットの電子署名を検証する。
#
# ・依頼して行った変更は署名付き  -> 成功（何も起きない）
# ・身に覚えのない push          -> ジョブを失敗させる
#                                   -> GitHub から所有者へ「実行が失敗しました」メールが自動送信される
#
# Teams への通知は、このPCの定期タスク homepage_guard が GitHub の外から
# 同じ検査を行って送る（GitHub 側の監視ごと消されても気づけるようにするため）。
#
# 5分おきの求人データ自動同期は GITHUB_TOKEN による push のため、
# GitHub の仕様でこのワークフローは起動しない。

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 署名を検証
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          bad=0
          for sha in $(echo "$COMMITS" | jq -r '.[].id'); do
            ok=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.verified')
            msg=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.message' | head -1)
            if [ "$ok" != "true" ]; then
              echo "::error::署名なしのコミットです: $sha $msg"
              bad=1
            else
              echo "OK  $sha  $msg"
            fi
          done
          if [ "$bad" = "1" ]; then
            echo "::error::依頼していない変更の可能性があります。内容を確認してください。"
            exit 1
          fi
          echo "すべて署名済み。問題ありません。"
